
services:
###> doctrine/doctrine-bundle ###
  database:
    image: mariadb:${MARIADB_VERSION:-10.4}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      # You should definitely change the password in production
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-app}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  warehouse:
    image: postgres:${DW_POSTGRES_VERSION:-16-alpine}
    environment:
      POSTGRES_DB: ${DW_POSTGRES_DB:-comdely_dw}
      POSTGRES_USER: ${DW_POSTGRES_USER:-comdely_dw}
      POSTGRES_PASSWORD: ${DW_POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - ${DW_POSTGRES_PORT:-5433}:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DW_POSTGRES_USER:-comdely_dw} -d ${DW_POSTGRES_DB:-comdely_dw}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - data_warehouse_data:/var/lib/postgresql/data
      - ./data-platform/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  data_warehouse_data:
