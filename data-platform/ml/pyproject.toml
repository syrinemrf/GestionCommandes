[build-system]
requires = ['setuptools==80.9.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'comdely-ml'
version = '0.1.0'
description = 'Demand dataset preparation and seasonal baseline for Comdely'
requires-python = '>=3.11,<3.13'
dependencies = [
    'numpy==2.3.2',
    'pandas==2.3.2',
    'joblib==1.5.1',
    'psycopg[binary]==3.2.9',
    'scikit-learn==1.7.1',
    'SQLAlchemy==2.0.43',
]

[project.optional-dependencies]
test = ['pytest==8.4.1']

[project.scripts]
comdely-ml-prepare = 'comdely_ml.cli:main'
comdely-ml-benchmark = 'comdely_ml.benchmark:main'
comdely-ml-migrate = 'comdely_ml.migrations:main'
comdely-ml-train = 'comdely_ml.operational_training:main'
comdely-ml-infer = 'comdely_ml.inference:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
addopts = '-ra'
testpaths = ['tests']
