version: 2

models:
  - name: mart_ml_daily_demand
    description: >
      Dataset journalier dense pour la prévision de demande. Le grain est une
      date, un fournisseur et une variation. Toutes les variations sont
      croisées avec chaque date observée, ce qui matérialise les jours sans
      vente avec une demande nulle. Les commandes annulées et supprimées sont
      exclues. Aucun état de stock n'est exposé au modèle.
    columns:
      - name: ml_daily_demand_key
        description: Clé substitut stable du couple date et variation.
        data_tests: [not_null, unique]
      - name: demand_date
        data_tests: [not_null]
      - name: product_created_at
        description: Date de création du produit, borne basse de la série dense.
        data_tests: [not_null]
      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: variation_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_variation')
                field: variation_key
      - name: source_supplier_id
        data_tests: [not_null]
      - name: source_product_id
        data_tests: [not_null]
      - name: source_variation_id
        data_tests: [not_null]
      - name: demand_quantity
        data_tests: [not_null]
      - name: last_updated_at
        data_tests: [not_null]

  - name: mart_supplier_stock_risk
    description: >
      Dernière prévision de risque de stock par variation. Le mart expose les
      clés naturelles fournisseur pour permettre l'isolation côté Symfony.
      Il ne réalise aucune écriture dans le stock opérationnel.
    columns:
      - name: supplier_stock_risk_key
        data_tests: [not_null, unique]
      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key
      - name: variation_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_variation')
                field: variation_key
      - name: source_supplier_id
        data_tests: [not_null]
      - name: source_variation_id
        data_tests: [not_null]
      - name: prediction_date
        data_tests: [not_null]
      - name: forecast_central_7d
        data_tests: [not_null]
      - name: forecast_q90_7d
        data_tests: [not_null]
      - name: stock_available
        data_tests: [not_null]
      - name: risk
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['HIGH', 'MEDIUM', 'LOW', 'INSUFFICIENT_DATA']
      - name: recommended_quantity
        data_tests: [not_null]
      - name: model_version
        data_tests: [not_null]
      - name: business_explanation
        description: Explication déterministe de la décision de risque, calculée pendant l'inférence.
        data_tests: [not_null]
      - name: shap_factors
        description: Trois principales contributions SHAP à la prévision q90, nulles en cas de cold start.
      - name: demand_history
        description: Quatorze derniers jours de demande utilisés pour le mini historique fournisseur.
        data_tests: [not_null]
      - name: last_updated_at
        data_tests: [not_null]
